[tool.poetry]
name = "bank-masks"
version = "0.1.0"
description = "Project for banking operations processing"
authors = ["Daniil <daniil@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pandas = "^2.2.0"
openpyxl = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
flake8 = "^6.0.0"
mypy = "^1.7.0"
black = "^23.0.0"
isort = "^5.12.0"
types-requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
